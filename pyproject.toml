[project]
name = "ocr-sub"
version = "0.2.0"
description = "Extract and OCR subtitles from video files or extracted images using VideoSubFinder, Google Lens, and Bing Visual Search OCR."
requires-python = ">=3.12"
dependencies = [
    "curl_cffi>=0.7.4",
    "rich>=13.9.4",
    "pillow>=11.1.0",
    "protobuf>=4.25.0",
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
]

[tool.isort]
combine_as_imports = true
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["ass", "bing", "engine", "gglens", "languages", "lens", "ocr", "pgs", "progress", "srt", "utils", "vsf"]
line_length = 120
multi_line_output = 0
profile = "black"
skip_gitignore = true

[tool.black]
include = '\.pyi?$'
line_length = 120
skip-string-normalization = false
target-version = ["py312"]
