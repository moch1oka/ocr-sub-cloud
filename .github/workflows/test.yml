name: Test OCR --no-filter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: powershell

      - name: Clean outputs before test (Linux)
        if: runner.os == 'Linux'
        run: rm -rf outputs outputs_bing
        shell: bash

      - name: Clean outputs before test (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path outputs) { Remove-Item -Recurse -Force outputs }
          if (Test-Path outputs_bing) { Remove-Item -Recurse -Force outputs_bing }
        shell: powershell

      - name: Run OCR test (Google Lens, dual format output)
        run: python run.py --img_dir test -f both

      - name: Check output subtitle files (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -f outputs/output_subtitles.ass ]; then echo "output_subtitles.ass not found!" && exit 1; fi
          if [ ! -f outputs/output_subtitles.srt ]; then echo "output_subtitles.srt not found!" && exit 1; fi
        shell: bash

      - name: Check output subtitle files (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path outputs/output_subtitles.ass)) { Write-Host "output_subtitles.ass not found!"; exit 1 }
          if (!(Test-Path outputs/output_subtitles.srt)) { Write-Host "output_subtitles.srt not found!"; exit 1 }
        shell: powershell

      - name: Run OCR test (Bing OCR)
        run: python run.py --img_dir test --ocr_engine bing -o outputs_bing

      - name: Check Bing output subtitle files (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -f outputs_bing/output_subtitles.ass ]; then echo "outputs_bing/output_subtitles.ass not found!" && exit 1; fi
        shell: bash

      - name: Check Bing output subtitle files (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path outputs_bing/output_subtitles.ass)) { Write-Host "outputs_bing/output_subtitles.ass not found!"; exit 1 }
        shell: powershell
