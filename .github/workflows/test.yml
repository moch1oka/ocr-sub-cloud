name: Test OCR --no-filter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: powershell

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Clean outputs before test (Linux)
        if: runner.os == 'Linux'
        run: rm -rf outputs outputs_bing
        shell: bash

      - name: Clean outputs before test (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path outputs) { Remove-Item -Recurse -Force outputs }
          if (Test-Path outputs_bing) { Remove-Item -Recurse -Force outputs_bing }
        shell: powershell

      - name: Run OCR test (Google Lens, dual format output)
        run: python run.py --img_dir test -f both

      - name: Check Google Lens output
        run: python tests/check_output.py outputs/output_subtitles.ass outputs/output_subtitles.srt

      - name: Run OCR test (Bing OCR)
        run: python run.py --img_dir test --ocr_engine bing -o outputs_bing

      - name: Check Bing output
        run: python tests/check_output.py outputs_bing/output_subtitles.ass
